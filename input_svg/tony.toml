# cookiemaker project config
# Resolution: [loops] > [classes] > defaults.
svg = "tony.svg"
output = "tony.stl"

# SVG user units -> mm.
scale = 1

# Defaults for every loop without a more specific override.
default_z = 40
default_width = 5

[loops]
"0" = { z = 40, width = 5 }

[bridges]
mode = "auto"
style = "bar"
width = 1.5
z = 2
branches = 2
radius = 0
