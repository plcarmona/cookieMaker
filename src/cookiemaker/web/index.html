<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cookiemaker</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three.module.js",
        "three/addons/": "/vendor/"
      }
    }
  </script>
</head>
<body>
  <div id="panel">
    <h1>cookiemaker</h1>

    <div class="section">
      <label>loop
        <select id="loop-select"></select>
      </label>
      <div id="loop-info" class="muted">click a part in the 3D view</div>
      <div class="row">
        <label>z <input id="loop-z" type="number" step="0.5" min="0" /></label>
        <label>width <input id="loop-w" type="number" step="0.25" min="0" /></label>
      </div>
    </div>

    <div class="section">
      <h2>bridges</h2>
      <div class="row">
        <label>mode
          <select id="br-mode">
            <option>auto</option><option>manual</option><option>off</option>
          </select>
        </label>
        <label>style
          <select id="br-style">
            <option value="bar">bar</option>
            <option value="tree">tree</option>
            <option value="plate">plate</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>width <input id="br-width" type="number" step="0.25" min="0.1" /></label>
        <label>z <input id="br-z" type="number" step="0.5" min="0.1" /></label>
        <label>branches <input id="br-branches" type="number" step="1" min="1" /></label>
        <label>radius <input id="br-radius" type="number" step="1" min="0" /></label>
      </div>
    </div>

    <div class="section">
      <h2>defaults</h2>
      <div class="row">
        <label>z <input id="def-z" type="number" step="0.5" min="0.1" /></label>
        <label>width <input id="def-w" type="number" step="0.25" min="0.1" /></label>
        <label>scale <input id="def-scale" type="number" step="0.1" min="0.01" /></label>
      </div>
    </div>

    <div class="section buttons">
      <button id="btn-rebuild">Rebuild</button>
      <button id="btn-save">Save TOML</button>
      <button id="btn-export" class="primary">Export STL</button>
    </div>

    <div class="section toggles">
      <label><input id="tg-wire" type="checkbox" /> wireframe</label>
      <label><input id="tg-bridges" type="checkbox" checked /> bridges</label>
      <label><input id="tg-footprints" type="checkbox" /> footprints</label>
    </div>

    <div id="colorbar"><div id="colorbar-grad"></div><div class="row"><span id="cb-min">0</span><span>z (mm)</span><span id="cb-max">?</span></div></div>
    <div id="status" class="muted"></div>
  </div>

  <div id="view">
    <div id="spinner"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
